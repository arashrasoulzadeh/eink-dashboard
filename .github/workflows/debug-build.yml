name: Debug build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug APK
        run: ./gradlew --no-configuration-cache assembleDebug
      - name: Name the APK after the commit
        run: cp app/build/outputs/apk/debug/app-debug.apk "einkdash-debug-${GITHUB_SHA::7}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: einkdash-debug-apk
          path: einkdash-debug-*.apk
      # Sideload-only app: tagged builds attach the APK to a GitHub release.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "einkdash-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "einkdash-${GITHUB_REF_NAME}.apk" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
